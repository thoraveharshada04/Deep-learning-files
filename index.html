
<!DOCTYPE html>
<html>
<head>
<title>Deep Learning Practical Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f2f4fa;margin:0;color:#243052}
header{background:#263b70;color:white;text-align:center;padding:40px 15px}
main{max-width:750px;margin:30px auto;padding:15px}
.card{background:white;padding:22px;margin:18px 0;border-radius:12px;box-shadow:0 3px 12px #ddd}
a{display:inline-block;background:#263b70;color:white;padding:10px 15px;margin:5px;border-radius:6px;text-decoration:none}
</style>
</head>
<body>
<header>
<h1>💻 Deep Learning Practical Hub</h1>
<p>All Practicals at One Place</p>
</header>
<main id="list"></main>
<script>
const user="thoraveharshada04";
const repo="Deep-learning-files";

const files=[
"DL Practcal4.ipynb",
"DL Practical1.ipynb",
"DL_PR_02-Updated.ipynb",
"pr3.ipynb",
"pr5.ipynb"
];

files.forEach((f,i)=>{
const url="https://github.com/"+user+"/"+repo+"/blob/main/"+encodeURIComponent(f);
document.getElementById("list").innerHTML+=`
<div class="card">
<h3>Practical ${i+1}</h3>
<p>${f}</p>
<a href="${url}" target="_blank">Open Practical</a>
<a href="https://raw.githubusercontent.com/${user}/${repo}/main/${encodeURIComponent(f)}" download>Download</a>
</div>`;
});
</script>
</body>
</html>
<div class="card">
  <h3>📂 Google Stock Dataset</h3>
  <p>GOOGL.csv</p>
  <a href="GOOGL.csv" download>
    Download Dataset ↓
  </a>
</div>
